<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me? - Interactive Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #ffe4e6 50%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cursive-font {
            font-family: 'Sacramento', cursive;
        }

        /* Pulsing SVG Coil track animation */
        .coil-track {
            fill: none;
            stroke: rgba(244, 63, 94, 0.15);
            stroke-width: 14;
            stroke-linecap: round;
        }

        .coil-pulse {
            fill: none;
            stroke: #f43f5e;
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 60 200;
            animation: coil-glow 2.5s ease-in-out infinite;
        }

        @keyframes coil-glow {
            0% {
                stroke-dashoffset: 0;
                filter: drop-shadow(0 0 2px rgba(244, 63, 94, 0.4));
            }
            50% {
                stroke-dashoffset: -130;
                filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.8));
            }
            100% {
                stroke-dashoffset: -260;
                filter: drop-shadow(0 0 2px rgba(244, 63, 94, 0.4));
            }
        }

        /* Heart beating animation */
        .pulse-heart {
            animation: heart-beat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            transform-origin: center;
        }

        @keyframes heart-beat {
            0% { transform: scale(1); }
            14% { transform: scale(1.18); }
            28% { transform: scale(1); }
            42% { transform: scale(1.18); }
            70% { transform: scale(1); }
        }

        /* Floating background elements */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: float-up 6s linear infinite;
            opacity: 0.6;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Unclickable button evasive transition */
        .evasive-btn {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(244, 63, 94, 0.15);
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center p-4 min-h-screen relative overflow-hidden select-none">

    <!-- Ambient floating hearts background -->
    <div id="heartsContainer" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-md flex justify-between items-center z-10 pt-2 px-2">
        <div class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
            <span class="text-xs font-bold uppercase tracking-wider text-rose-600">Love Quest</span>
        </div>
        <button id="soundToggleBtn" class="bg-white/80 hover:bg-white text-rose-600 p-2.5 rounded-full shadow-md backdrop-blur-sm transition-all duration-200 active:scale-95" title="Toggle Sound Effects">
            <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
            <svg id="soundOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
            </svg>
        </button>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-sm z-10 my-auto">
        <div class="glass-card rounded-3xl p-8 text-center relative overflow-hidden transition-all duration-300">
            
            <!-- SVG Animated Ring & Avatar -->
            <div class="relative w-40 h-40 mx-auto mb-6 flex items-center justify-center">
                <!-- SVG Ring Animation -->
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle class="coil-track" cx="50" cy="50" r="40" />
                    <circle class="coil-pulse" cx="50" cy="50" r="40" />
                </svg>

                <!-- Center Heart Icon -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-24 h-24 rounded-full bg-rose-100 flex items-center justify-center shadow-inner">
                        <svg class="w-14 h-14 text-rose-500 pulse-heart fill-current" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Card Headline -->
            <h1 id="cardTitle" class="text-2xl font-extrabold text-slate-800 mb-2 tracking-tight">
                Do you love me? <span class="inline-block text-rose-500">❤️</span>
            </h1>
            <p id="cardSub" class="text-sm text-slate-500 mb-8 font-medium">
                Choose wisely! There's only one right answer.
            </p>

            <!-- Buttons Area -->
            <div id="btnContainer" class="relative h-24 flex items-center justify-center gap-4">
                <!-- Yes Button -->
                <button id="yesBtn" class="bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-rose-500/30 hover:shadow-rose-500/50 transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 z-20 flex items-center gap-2 text-base">
                    <span>Yes!</span>
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </button>

                <!-- Unclickable / Evasive NO Button -->
                <button id="noBtn" class="evasive-btn bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-8 rounded-full shadow-md z-10 text-base">
                    No 💔
                </button>
            </div>

            <!-- Interactive Counter / Status -->
            <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                <span>Attempts to click NO: <strong id="dodgeCount" class="text-rose-500">0</strong></span>
                <span class="cursive-font text-lg text-rose-400">My heart says YES!</span>
            </div>
        </div>
    </main>

    <!-- Success Modal Overlay -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card bg-white rounded-3xl p-8 max-w-sm w-full text-center transform scale-90 opacity-0 transition-all duration-300" id="modalContent">
            <div class="w-20 h-20 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                <svg class="w-12 h-12 fill-current" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">I KNEW IT! 🎉</h2>
            <p class="text-slate-600 text-sm mb-6">
                You made the best decision today! Sending you endless love and warm hugs! 💖✨
            </p>
            <button id="resetBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all">
                Play Again 🔄
            </button>
        </div>
    </div>

    <!-- Footer Credit -->
    <footer class="z-10 text-center pb-2">
        <p class="text-xs font-semibold text-rose-400/80 tracking-wide">
            Interactive Animation • Powered by CSS & JS
        </p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // DOM Elements
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const dodgeCountEl = document.getElementById('dodgeCount');
        const heartsContainer = document.getElementById('heartsContainer');
        const successModal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');
        const resetBtn = document.getElementById('resetBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');

        let dodgeCount = 0;
        let isSoundOn = true;
        let yesScale = 1;

        // Web Audio API Synth for Sound Effects (No external audio files needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPopSound() {
            if (!isSoundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playCheerSound() {
            if (!isSoundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + idx * 0.1);
                osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
            });
        }

        // Toggle Sound State
        soundToggleBtn.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            soundOnIcon.classList.toggle('hidden', !isSoundOn);
            soundOffIcon.classList.toggle('hidden', isSoundOn);
        });

        // Function to relocate NO button randomly when hovered or touched
        function dodgeNoButton() {
            dodgeCount++;
            dodgeCountEl.textContent = dodgeCount;
            playPopSound();

            // Grow YES button slightly each time NO is dodged
            yesScale += 0.08;
            if (yesScale <= 1.8) {
                yesBtn.style.transform = `scale(${yesScale})`;
            }

            const card = noBtn.closest('.glass-card');
            const cardRect = card.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            // Calculate safe bounds inside card container
            const padding = 20;
            const minX = padding;
            const maxX = cardRect.width - btnRect.width - padding;
            const minY = padding;
            const maxY = cardRect.height - btnRect.height - padding;

            const randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

            noBtn.style.position = 'absolute';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Evasive Events for Mouse & Touch
        noBtn.addEventListener('mouseenter', dodgeNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeNoButton();
        });

        // Yes Button Click Celebration
        yesBtn.addEventListener('click', () => {
            playCheerSound();
            
            // Trigger Confetti Explosion
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#f43f5e', '#ec4899', '#fb7185', '#ffd166']
            });

            // Show Success Modal
            successModal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-90', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 50);
        });

        // Reset Button
        resetBtn.addEventListener('click', () => {
            dodgeCount = 0;
            yesScale = 1;
            dodgeCountEl.textContent = '0';

            yesBtn.style.transform = 'scale(1)';
            noBtn.style.position = 'relative';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';

            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-90', 'opacity-0');
            setTimeout(() => {
                successModal.classList.add('hidden');
            }, 300);
        });

        // Generate Ambient Floating Background Hearts
        function spawnFloatingHearts() {
            const heartIcons = ['❤️', '💖', '💕', '💗', '💓'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-2xl';
                heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${4 + Math.random() * 5}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heartsContainer.appendChild(heart);
            }
        }

        // Initialize Background
        spawnFloatingHearts();
    </script>
</body>
</html>
